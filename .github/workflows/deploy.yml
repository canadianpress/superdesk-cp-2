name: Deploy

on:
  push:
    branches:
      - test-ci-cd
  pull_request:
    types:
      - closed
    branches:
      - test-ci-cd

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute SSM Command
        run: |
          TARGET_DIR="${{ vars.TARGET_DIR }}"
          REPO_URL="${{ vars.REPO_URL }}"
          REPO_REF="${{ vars.REPO_REF }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"
          SSM_ENV_PARAM_NAME="${{ vars.SSM_ENV_PARAM_NAME }}"
          MAX_POLL_TIME="${{ vars.MAX_POLL_TIME || '900' }}"
          POLL_INTERVAL="${{ vars.POLL_INTERVAL || '10' }}"
          MAX_ATTEMPTS=$((MAX_POLL_TIME / POLL_INTERVAL))

          SSM_COMMANDS=$(cat <<EOF
            set -e
            exec 2>&1

            export AWS_DEFAULT_REGION="$AWS_REGION"

            if ! command -v aws &> /dev/null; then
              echo "Installing AWS CLI..."
              NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive sudo apt-get update -qq
              NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq awscli
            fi

            if [ -d "$TARGET_DIR/.git" ]; then
              echo "Updating existing repository at $TARGET_DIR..."
              cd $TARGET_DIR
              git fetch origin
              git checkout $REPO_REF
              git reset --hard origin/$REPO_REF
            else
              echo "Cloning new repository into $TARGET_DIR..."
              git clone -b $REPO_REF $REPO_URL $TARGET_DIR
              cd $TARGET_DIR
            fi

            echo "Current HEAD"
            git -C $TARGET_DIR rev-parse HEAD

            echo "Writing .env file from SSM Parameter Store..."
            aws ssm get-parameter \
              --name "$SSM_ENV_PARAM_NAME" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text > .env
            chmod 600 .env

            echo $USER
            whoami

            cd deploy/hosts
            sudo ./setup-cms-system.sh
            cd ../services
            ./cms.sh

          EOF
          )

          PAYLOAD=$(echo "$SSM_COMMANDS" | jq -R -s -c 'split("\n")')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $PAYLOAD}" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM command: $COMMAND_ID"

          STATUS="InProgress"
          ATTEMPTS=0

          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
              echo "Timed out waiting for SSM command"
              break
            fi
            sleep $POLL_INTERVAL
            ATTEMPTS=$((ATTEMPTS+1))
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "InProgress")
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "Deployment: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi
