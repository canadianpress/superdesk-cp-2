name: Deploy

on:
  pull_request:
    types:
      - closed
    branches:
      - test-ci-cd

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute SSM Command
        run: |
          TARGET_DIR="${{ vars.TARGET_DIR }}"
          REPO_URL="${{ vars.REPO_URL }}"
          REPO_REF="${{ vars.REPO_REF }}"

          # Script executed remotely on the EC2 instance
          SSM_COMMANDS=$(cat <<EOF
            set -e
            if [ -d "$TARGET_DIR/.git" ]; then
              cd $TARGET_DIR
              git fetch origin
              git checkout $REPO_REF
              git reset --hard origin/$REPO_REF
            else
              git clone -b $REPO_REF $REPO_URL $TARGET_DIR
            fi
          EOF
          )

          PAYLOAD=$(echo "$SSM_COMMANDS" | jq -R -s -c 'split("\n")')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $PAYLOAD}" \
            --query "Command.CommandId" \
            --output text)

          echo "Sent SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text