services:
  redis:
    image: redis:${REDIS_VERSION:-5.0}
    ports:
      - "6379:6379"

  mongo:
    image: mongo:${MONGO_VERSION:-6.0}
    platform: linux/amd64
    ports:
      - "27017:27017"

  elastic:
    image: elasticsearch:${ELASTICSEARCH_VERSION:-7.17.10}
    environment:
      - discovery.type=single-node
    ports:
      - "9200:9200"